name: telegram-fix
# One-time: rewrite the earlier posts in the clearer format. Deleted after it has run.
on:
  push:
    branches: [main]
    paths: [".github/workflows/telegram-fix.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find the old posts on the channel's public page and rewrite them
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF' 2>&1 | tee runs/telegram_fix.log
          import json, os, re, urllib.request
          import telegram_post as t
          chat, token = os.environ["TELEGRAM_CHAT_ID"], os.environ["TELEGRAM_BOT_TOKEN"]
          if not chat.startswith("@"):
              raise SystemExit("the channel id is numeric (private channel): the post links are needed instead")
          html = urllib.request.urlopen(f"https://t.me/s/{chat[1:]}", timeout=30).read().decode()
          posts = {}
          for part in html.split('data-post="')[1:]:
              m = re.search(r"Crypto ranking, (\d{4}-\d\d-\d\d)", part)
              if m:
                  posts[m.group(1)] = part.split('"')[0].split("/")[-1]
          print(f"old-format posts found: {posts}")
          log = json.load(open("runs/rank_paper.json"))
          for date, mid in sorted(posts.items()):
              t.call("editMessageText", token, chat_id=chat, message_id=mid, text=t.message(log, date))
              print(f"edited message {mid} ({date})")
          EOF
      - name: Commit the result
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add runs/telegram_fix.log && git commit -q -m "Telegram fix result" && git pull -q --rebase --autostash && git push -q
